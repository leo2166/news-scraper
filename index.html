<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias y Tasas - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Noticias y Tasas <span style="font-weight: 300; opacity: 0.7;">Dashboard</span></h1>
        <div style="font-size: 0.9rem; color: var(--text-secondary);">
            Última actualización: <span id="last-update">Cargando...</span>
        </div>
    </header>

    <div class="dashboard-grid" id="dashboard-container">
        <div class="loading">Cargando datos...</div>
    </div>

    <template id="rate-card-template">
        <div class="card">
            <div class="card-header">
                <span class="source-tag"></span>
                <span class="timestamp">Live</span>
            </div>
            <div class="rate-display">
                <div class="rate-value">-- <span style="font-size: 1rem; opacity: 0.5;">VES</span></div>
                <div class="rate-change"></div>
            </div>
        </div>
    </template>

    <template id="news-card-template">
        <div class="card">
            <div class="card-header">
                <span class="source-tag tag-news"></span>
                <span class="timestamp"></span>
            </div>
            <img src="" alt="News Image" class="news-image" referrerpolicy="no-referrer">
            <h3 class="news-title"></h3>
            <div class="news-footer">
                <a href="#" target="_blank" class="read-more">Leer más →</a>
            </div>
        </div>
    </template>

    <script>
        function loadData() {
            if (window.location.protocol === 'file:') {
                // Carga dinámica local para file:// evitando caché
                const script = document.createElement('script');
                script.src = 'data.js?t=' + Date.now();
                script.onload = () => {
                    if (window.DASHBOARD_DATA) {
                        render(window.DASHBOARD_DATA);
                    }
                };
                script.onerror = () => {
                    document.getElementById('dashboard-container').innerHTML =
                        '<div class="loading" style="color: #ef4444;">Error al cargar datos locales (data.js no encontrado).</div>';
                };
                document.body.appendChild(script);
            } else {
                // Petición web con cache-busting para servidores (GitHub Pages, Vercel, etc.)
                fetch('data.json?t=' + Date.now())
                    .then(res => res.json())
                    .then(data => render(data))
                    .catch(e => {
                        console.error(e);
                        document.getElementById('dashboard-container').innerHTML =
                            '<div class="loading" style="color: #ef4444;">Error de carga.<br>No se pudieron obtener los datos.</div>';
                    });
            }
        }

        function render(data) {
            const container = document.getElementById('dashboard-container');
            container.innerHTML = '';

            const date = new Date(data.lastUpdate);
            document.getElementById('last-update').textContent = date.toLocaleTimeString();

            // Rates
            if (data.rates.bcv) {
                const fechaValorBCV = data.rates.bcv.fechaValor || null;
                if (data.rates.bcv.usd) createRateCard(container, 'BCV Dólar', data.rates.bcv.usd, 'tag-bcv', fechaValorBCV);
                if (data.rates.bcv.eur) createRateCard(container, 'BCV Euro', data.rates.bcv.eur, 'tag-bcv', fechaValorBCV);
            }
            /*
            if (data.rates.kontigo && data.rates.kontigo.usd) {
                createRateCard(container, 'Kontigo', data.rates.kontigo.usd, 'tag-kontigo');
            }
            */
            if (data.rates.binance && data.rates.binance.usdt) {
                createRateCard(container, 'Binance USDT', data.rates.binance.usdt, 'tag-binance');
            }

            // News
            if (data.news && data.news.length > 0) {
                data.news.forEach((item, index) => {
                    const tmpl = document.getElementById('news-card-template');
                    const clone = tmpl.content.cloneNode(true);

                    const card = clone.querySelector('.card');

                    clone.querySelector('.source-tag').textContent = item.source;
                    
                    let imageUrl = item.image || 'https://via.placeholder.com/300x160?text=No+Image';
                    if (item.image && (item.image.includes('bancaynegocios.com') || item.image.includes('noticialdia.com'))) {
                        imageUrl = `https://images.weserv.nl/?url=${encodeURIComponent(item.image)}`;
                    }
                    clone.querySelector('.news-image').src = imageUrl;
                    
                    clone.querySelector('.news-title').textContent = item.title || 'Sin título';
                    // Portales bloqueados en Venezuela sin VPN → proxy via Google Translate (sirve la página en vivo)
                    const BLOCKED_DOMAINS = ['noticialdia.com'];
                    const isBlocked = item.link && BLOCKED_DOMAINS.some(d => item.link.includes(d));
                    clone.querySelector('.read-more').href = isBlocked
                        ? `https://translate.google.com/translate?sl=es&tl=es&u=${encodeURIComponent(item.link)}`
                        : item.link;

                    container.appendChild(clone);
                });
            } else {
                container.innerHTML += '<div class="loading">No hay noticias capturadas.</div>';
            }
        }

        function createRateCard(container, name, value, tagClass, fechaValor) {
            const tmpl = document.getElementById('rate-card-template');
            const clone = tmpl.content.cloneNode(true);

            clone.querySelector('.source-tag').textContent = name;
            clone.querySelector('.source-tag').classList.add(tagClass);
            clone.querySelector('.rate-value').innerHTML = `${value} <span style="font-size: 1rem; opacity: 0.5;">VES</span>`;

            // Mostrar la Fecha Valor oficial del BCV en azul bajo las tasas
            if (fechaValor) {
                const fechaEl = document.createElement('div');
                fechaEl.style.cssText = 'font-size: 0.82rem; color: #3b82f6; font-weight: 700; margin-top: 8px;';
                fechaEl.textContent = `Fecha Valor: ${fechaValor}`;
                const rateDisplay = clone.querySelector('.rate-display');
                rateDisplay.appendChild(fechaEl);
            }

            container.appendChild(clone);
        }

        loadData();
        // Auto-refresh page every 5 min
        setTimeout(() => window.location.reload(), 300000); 
    </script>

</body>

</html>
